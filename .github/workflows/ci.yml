name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - master

jobs:
  backend:
    name: Backend - typecheck, test & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type check
        run: npx tsc --noEmit

      # Chạy toàn bộ unit + integration test (vitest) kèm đo độ phủ.
      # Test đã mock Prisma nên KHÔNG cần database thật trên CI.
      - name: Test + đo độ phủ
        run: npm run test:coverage

      # Hiện % độ phủ ngay trong tab Summary của lần chạy CI, để độ phủ là con số
      # nhìn thấy được chứ không phải cảm tính. Không chặn merge — chỉ để theo dõi
      # xu hướng: độ phủ phải TĂNG dần qua từng vòng, không được tụt.
      - name: Ghi độ phủ vào Summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e "
              const c = require('./coverage/coverage-summary.json').total;
              const row = (n, m) => \`| \${n} | \${m.pct}% | \${m.covered}/\${m.total} |\`;
              console.log('## 📊 Độ phủ test — Backend\n');
              console.log('| Loại | % | Đã phủ |');
              console.log('|---|---|---|');
              console.log(row('Dòng lệnh', c.lines));
              console.log(row('Hàm', c.functions));
              console.log(row('Nhánh rẽ', c.branches));
              console.log(row('Câu lệnh', c.statements));
            " >> \$GITHUB_STEP_SUMMARY
          else
            echo 'Không tạo được báo cáo độ phủ.' >> \$GITHUB_STEP_SUMMARY
          fi

      - name: Build
        run: npm run build

  frontend:
    name: Frontend - lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  mobile:
    name: Mobile - lint, typecheck & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Mobile không build trên CI — build thật do EAS Build lo (xem S9).
      - name: Type check
        run: npm run typecheck

      # jest-expo phải biên dịch toàn bộ React Native nên cần nhiều RAM + dung lượng tạm.
      # Máy phát triển hiện tại không đủ chỗ để chạy (xem docs/LESSONS_LEARNED.md),
      # nên CI là nơi duy nhất verify được test mobile.
      - name: Test
        run: npm test
