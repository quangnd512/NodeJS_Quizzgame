name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - master

jobs:
  backend:
    name: Backend - typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type check
        run: npx tsc --noEmit

      # Chạy toàn bộ unit + integration test (vitest).
      # Test đã mock Prisma nên KHÔNG cần database thật trên CI.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  frontend:
    name: Frontend - lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  mobile:
    name: Mobile - lint, typecheck & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Mobile không build trên CI — build thật do EAS Build lo (xem S9).
      - name: Type check
        run: npm run typecheck

      # jest-expo phải biên dịch toàn bộ React Native nên cần nhiều RAM + dung lượng tạm.
      # Máy phát triển hiện tại không đủ chỗ để chạy (xem docs/LESSONS_LEARNED.md),
      # nên CI là nơi duy nhất verify được test mobile.
      - name: Test
        run: npm test
